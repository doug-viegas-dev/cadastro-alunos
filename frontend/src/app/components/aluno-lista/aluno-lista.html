<h2>Lista de Alunos</h2>
<table mat-table [dataSource]="alunos()">
    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let aluno"> {{aluno.nome}} </td>
    </ng-container>
    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> E-mail </th>
        <td mat-cell *matCellDef="let aluno"> {{aluno.email}} </td>
    </ng-container>
    <ng-container matColumnDef="telefone">
        <th mat-header-cell *matHeaderCellDef> Telefone </th>
        <td mat-cell *matCellDef="let aluno"> {{aluno.telefone}} </td>
    </ng-container>
    <ng-container matColumnDef="celular">
        <th mat-header-cell *matHeaderCellDef> Celular </th>
        <td mat-cell *matCellDef="let aluno"> {{aluno.celular}} </td>
    </ng-container>
    <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef> CPF </th>
        <td mat-cell *matCellDef="let aluno"> {{ aluno.cpf | cpf }} </td>
    </ng-container>
    <ng-container matColumnDef="data_nascimento">
        <th mat-header-cell *matHeaderCellDef> Data de Nascimento </th>
        <td mat-cell *matCellDef="let aluno"> {{ aluno.data_nascimento | dataBr }} </td>
    </ng-container>
    <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let aluno">
            <button mat-icon-button class="icone-editar" aria-label="Editar" (click)="iniciarEdicao.emit(aluno)">
                <mat-icon fontSet="material-symbols-outlined">edit_square</mat-icon>
            </button>
            <button mat-icon-button class="icone-remover" aria-label="Remover" (click)="remover.emit(aluno)">
                <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
            </button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let linha; columns: colunas;"></tr>
</table>
